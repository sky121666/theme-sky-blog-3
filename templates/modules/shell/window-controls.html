<th:block th:fragment="trafficLights (maximizable)">
    <div class="traffic-lights flex items-center gap-2">
        <button type="button" @click="closeWindow()" class="traffic-btn close" aria-label="关闭" title="关闭">
            <span class="icon-[lucide--x]" aria-hidden="true"></span>
        </button>
        <button type="button" @click="$store.windowManager.minimize()" class="traffic-btn minimize" aria-label="最小化" title="最小化">
            <span class="icon-[lucide--minus]" aria-hidden="true"></span>
        </button>
        <button th:if="${maximizable == true or maximizable == 'true'}"
                type="button"
                x-cloak
                x-show="isDesktop"
                @click="toggleMaximize()"
                class="traffic-btn maximize"
                :aria-label="isMaximized ? '还原窗口' : '最大化'"
                :title="isMaximized ? '还原窗口' : '最大化'">
            <span :class="isMaximized ? 'icon-[lucide--minimize-2]' : 'icon-[lucide--maximize-2]'" aria-hidden="true"></span>
        </button>
    </div>
</th:block>
