<section xmlns:th="https://www.thymeleaf.org" th:fragment="pane"
         class="theme-settings-pane theme-settings-pane-desktop-dock" data-settings-pane="desktop-dock"
         x-show="$store.themeSettings.activePane === 'desktop-dock'" aria-labelledby="theme-settings-title">
  <section class="theme-settings-section">
    <h3 class="theme-settings-section-title">快捷入口</h3>
    <div class="theme-settings-group">
      <label class="theme-settings-input-row" data-setting-path="navigation.dock.menu_name">
        <span class="theme-settings-copy"><strong>Dock 菜单</strong></span>
        <select :value="$store.themeSettings.value('navigation.dock.menu_name')"  @change="$store.themeSettings.update('navigation.dock.menu_name', $event.target.value)">
          <option value="">沿用默认菜单</option>
          <template x-if="$store.themeSettings.value('navigation.dock.menu_name') && !$store.themeSettings.resourceOptions('menus').some(option => option.name === $store.themeSettings.value('navigation.dock.menu_name'))"><option :value="$store.themeSettings.value('navigation.dock.menu_name')" selected x-text="'已选菜单：' + $store.themeSettings.value('navigation.dock.menu_name')"></option></template>
          <template x-for="option in $store.themeSettings.resourceOptions('menus')" :key="option.name"><option :value="option.name" :disabled="option.disabled" :selected="$store.themeSettings.value('navigation.dock.menu_name') === option.name" x-text="option.label"></option></template>
        </select>
      </label>
      <label class="theme-settings-group-row" data-setting-path="dock.appearance.settings_enabled">
        <span class="theme-settings-copy"><strong>显示系统设置</strong></span>
        <input type="checkbox" class="theme-settings-switch-input" :checked="$store.themeSettings.value('dock.appearance.settings_enabled')"
               @change="$store.themeSettings.update('dock.appearance.settings_enabled', $event.target.checked)" />
        <span class="theme-settings-switch" aria-hidden="true"></span>
      </label>
    </div>
    <p class="theme-settings-section-note">Dock 显示后台菜单的一级入口，名称和图标在后台菜单中管理。</p>
    <div class="theme-settings-resource-error" x-show="$store.themeSettings.resourceState('menus').error" role="alert"><span x-text="$store.themeSettings.resourceState('menus').error"></span><button type="button" class="theme-settings-text-button" @click="$store.themeSettings.loadResources('menus')">重试</button></div>
    <div class="theme-settings-resource-toolbar"><span class="theme-settings-section-note" x-show="$store.themeSettings.resourceState('menus').busy" role="status">正在加载菜单…</span><button type="button" class="theme-settings-secondary-button" :disabled="$store.themeSettings.resourceState('menus').busy" @click="$store.themeSettings.loadResources('menus')">刷新菜单列表</button><button type="button" class="theme-settings-text-button" x-show="$store.themeSettings.resourceState('menus').hasNext" :disabled="$store.themeSettings.resourceState('menus').busy" @click="$store.themeSettings.loadResources('menus', true)">加载更多</button></div>
  </section>
  <section class="theme-settings-section">
    <h3 class="theme-settings-section-title">Dock</h3>
    <div class="theme-settings-group">
      <label class="theme-settings-group-row" data-setting-path="dock.appearance.show_labels">
        <span class="theme-settings-copy"><strong>显示名称标签</strong></span>
        <input type="checkbox" class="theme-settings-switch-input" :checked="$store.themeSettings.value('dock.appearance.show_labels')"
               @change="$store.themeSettings.update('dock.appearance.show_labels', $event.target.checked)" />
        <span class="theme-settings-switch" aria-hidden="true"></span>
      </label>
      <label class="theme-settings-group-row" data-setting-path="dock.appearance.magnification">
        <span class="theme-settings-copy"><strong>图标放大</strong></span>
        <input type="checkbox" class="theme-settings-switch-input" :checked="$store.themeSettings.value('dock.appearance.magnification')"
               @change="$store.themeSettings.update('dock.appearance.magnification', $event.target.checked)" />
        <span class="theme-settings-switch" aria-hidden="true"></span>
      </label>
    </div>

  </section>
  <section class="theme-settings-section">
    <h3 class="theme-settings-section-title">Dock 尺寸与背景</h3>
    <div class="theme-settings-group">
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.icon_size">
        <span class="theme-settings-copy"><strong>图标大小</strong></span>
        <input type="range" min="36" max="64" step="2"
               :value="$store.themeSettings.value('dock.appearance.icon_size')" @input="$store.themeSettings.update('dock.appearance.icon_size', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.icon_size') + ' px'"></output>
      </label>
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.icon_gap">
        <span class="theme-settings-copy"><strong>图标间距</strong></span>
        <input type="range" min="2" max="12" step="1"
               :value="$store.themeSettings.value('dock.appearance.icon_gap')" @input="$store.themeSettings.update('dock.appearance.icon_gap', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.icon_gap') + ' px'"></output>
      </label>
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.dock_padding">
        <span class="theme-settings-copy"><strong>面板内边距</strong></span>
        <input type="range" min="4" max="16" step="1"
               :value="$store.themeSettings.value('dock.appearance.dock_padding')" @input="$store.themeSettings.update('dock.appearance.dock_padding', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.dock_padding') + ' px'"></output>
      </label>
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.magnification_scale">
        <span class="theme-settings-copy"><strong>放大倍率</strong></span>
        <input type="range" min="1" max="2" step="0.1" :disabled="!$store.themeSettings.value('dock.appearance.magnification')"
               :value="$store.themeSettings.value('dock.appearance.magnification_scale')" @input="$store.themeSettings.update('dock.appearance.magnification_scale', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.magnification_scale') + ' 倍'"></output>
      </label>
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.glass_blur">
        <span class="theme-settings-copy"><strong>背景模糊</strong></span>
        <input type="range" min="20" max="100" step="5"
               :value="$store.themeSettings.value('dock.appearance.glass_blur')" @input="$store.themeSettings.update('dock.appearance.glass_blur', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.glass_blur') + ' px'"></output>
      </label>
      <label class="theme-settings-range-row" data-setting-path="dock.appearance.glass_opacity">
        <span class="theme-settings-copy"><strong>背景不透明度</strong></span>
        <input type="range" min="10" max="80" step="2"
               :value="$store.themeSettings.value('dock.appearance.glass_opacity')" @input="$store.themeSettings.update('dock.appearance.glass_opacity', $event.target.value)" />
        <output x-text="$store.themeSettings.value('dock.appearance.glass_opacity') + '%'"></output>
      </label>
    </div>
  </section>

</section>
