<th:block xmlns:th="https://www.thymeleaf.org" th:fragment="window (authenticated, themeName, configEndpoint)">
  <span hidden data-theme-settings-protocol th:data-authenticated="${authenticated}" th:data-theme-name="${themeName}" th:data-config-endpoint="${configEndpoint}"
        th:data-site-logo="${site.logo}"
        th:data-app-moments="${pluginFinder.available('PluginMoments')}"
        th:data-app-douban="${pluginFinder.available('plugin-douban')}"
        th:data-app-links="${pluginFinder.available('PluginLinks')}"
        th:data-app-steam="${pluginFinder.available('steam') or pluginFinder.available('halo-plugin-steam') or pluginFinder.available('PluginSteam') or pluginFinder.available('plugin-steam')}"
        th:data-app-equipments="${pluginFinder.available('equipment')}">Halo 配置是唯一数据源</span>
  <div class="theme-settings-layer" x-data x-cloak x-show="$store.themeSettings.visible"
       :class="{ 'is-open': $store.themeSettings.open }" :data-active-pane="$store.themeSettings.activePane">
    <div class="theme-settings-backdrop" aria-hidden="true"></div>
    <section class="theme-settings-window" data-theme-settings-window tabindex="-1" role="dialog" aria-modal="false" aria-labelledby="theme-settings-title">
      <header class="theme-settings-titlebar">
        <div class="theme-settings-window-controls">
          <div class="theme-settings-traffic" aria-label="窗口控制">
            <button type="button" class="theme-settings-traffic-button is-close" title="关闭" aria-label="关闭系统设置" @click="$store.themeSettings.close()"><span class="icon-[lucide--x]" aria-hidden="true"></span></button>
            <span class="theme-settings-traffic-button is-minimize" aria-hidden="true"></span><span class="theme-settings-traffic-button is-zoom" aria-hidden="true"></span>
          </div>
        </div>
        <div class="theme-settings-toolbar">
          <button type="button" class="theme-settings-sidebar-toggle" data-theme-settings-sidebar-toggle :aria-expanded="$store.themeSettings.mobileSidebarOpen.toString()" aria-controls="theme-settings-sidebar" aria-label="展开设置分类" @click="$store.themeSettings.toggleMobileSidebar()"><span class="icon-[lucide--panel-left]" aria-hidden="true"></span></button>
          <button type="button" class="theme-settings-back-button" :disabled="!$store.themeSettings.canGoBack()" aria-label="返回上一设置分类" @click="$store.themeSettings.backPane()"><span class="icon-[lucide--chevron-left]" aria-hidden="true"></span></button>
          <h2 id="theme-settings-title" class="theme-settings-title" x-text="$store.themeSettings.paneLabel()">外观</h2>
          <button type="button" class="theme-settings-mobile-close" aria-label="关闭系统设置" @click="$store.themeSettings.close()"><span class="icon-[lucide--x]" aria-hidden="true"></span></button>
        </div>
      </header>
      <div class="theme-settings-shell">
        <button type="button" class="theme-settings-sidebar-backdrop" :class="{ 'is-open': $store.themeSettings.mobileSidebarOpen }" tabindex="-1" aria-hidden="true" aria-label="收起设置分类" @click="$store.themeSettings.closeMobileSidebar()"></button>
        <aside id="theme-settings-sidebar" class="theme-settings-sidebar" :class="{ 'is-open': $store.themeSettings.mobileSidebarOpen }"
               :inert="$store.themeSettings.isMobileViewport && !$store.themeSettings.mobileSidebarOpen" :aria-hidden="($store.themeSettings.isMobileViewport && !$store.themeSettings.mobileSidebarOpen).toString()"
               @keydown.tab="$store.themeSettings.handleMobileSidebarFocusTrap($event)" aria-label="设置分类">
          <label class="theme-settings-search"><span class="icon-[lucide--search]" aria-hidden="true"></span><input type="search" x-model.debounce.150ms="$store.themeSettings.query" placeholder="搜索设置" aria-label="搜索设置" /></label>
          <div class="theme-settings-sidebar-scroll">
            <nav class="theme-settings-navigation" aria-label="主题设置分类">
              <template x-for="(item, index) in $store.themeSettings.filteredNavItems()" :key="item.id">
                <button type="button" :class="{ 'is-active': $store.themeSettings.activePane === item.id, 'is-group-start': index > 0 && item.group !== $store.themeSettings.filteredNavItems()[index - 1]?.group }"
                        :aria-current="$store.themeSettings.activePane === item.id ? 'page' : null" @click="$store.themeSettings.switchPane(item.id)">
                  <span class="theme-settings-navigation-icon" :data-pane-icon="item.id" :data-icon-color="item.color"><span :class="item.icon" aria-hidden="true"></span></span>
                  <strong x-text="item.label"></strong><span class="theme-settings-dirty-dot" x-show="$store.themeSettings.paneDirtyCount(item.id) > 0" :aria-label="$store.themeSettings.paneDirtyCount(item.id) + ' 项未应用修改'"></span>
                </button>
              </template>
            </nav>
            <div class="theme-settings-search-results" x-show="$store.themeSettings.query.trim()">
              <p class="theme-settings-search-caption" x-show="$store.themeSettings.searchResults().length">匹配的设置</p>
              <template x-for="result in $store.themeSettings.searchResults()" :key="result.path"><button type="button" @click="$store.themeSettings.focusSetting(result.path)"><strong x-text="result.label"></strong><small x-text="result.paneLabel"></small></button></template>
              <p class="theme-settings-search-empty" x-show="!$store.themeSettings.searchResults().length && !$store.themeSettings.filteredNavItems().length">没有找到相关设置</p>
            </div>
          </div>
        </aside>
        <div class="theme-settings-main" :inert="$store.themeSettings.mobileSidebarOpen" :aria-hidden="$store.themeSettings.mobileSidebarOpen.toString()">
          <main class="theme-settings-content" data-theme-settings-content>
            <th:block th:replace="~{modules/shell/settings/appearance :: pane}" />
            <th:block th:replace="~{modules/shell/settings/wallpaper :: pane}" />
            <th:block th:replace="~{modules/shell/settings/desktop-dock :: pane}" />
            <th:block th:replace="~{modules/shell/settings/menu-control :: pane}" />
            <th:block th:replace="~{modules/shell/settings/navigation :: pane}" />
            <th:block th:replace="~{modules/shell/settings/widgets :: pane}" />
            <th:block th:replace="~{modules/shell/settings/notifications :: pane}" />
            <th:block th:replace="~{modules/shell/settings/apps :: pane}" />
            <th:block th:replace="~{modules/shell/settings/startup :: pane}" />
            <th:block th:replace="~{modules/shell/settings/advanced :: pane}" />
          </main>
          <footer class="theme-settings-actions">
            <button type="button" class="theme-settings-secondary-button" :disabled="!$store.themeSettings.hasDirtyChanges() || $store.themeSettings.saving" @click="$store.themeSettings.restoreDraft()">取消</button>
            <div class="theme-settings-save-status" role="status" x-show="$store.themeSettings.statusMessage" :data-tone="$store.themeSettings.statusTone">
              <span :class="{ 'icon-[lucide--circle-check]': $store.themeSettings.statusTone === 'success', 'icon-[lucide--triangle-alert]': $store.themeSettings.statusTone === 'warning' || $store.themeSettings.statusTone === 'error', 'icon-[lucide--info]': $store.themeSettings.statusTone === 'muted' }" aria-hidden="true"></span>
              <span x-text="$store.themeSettings.statusMessage"></span>
            </div>
            <div class="theme-settings-action-end">
              <button type="button" class="theme-settings-secondary-button" x-show="$store.themeSettings.reloadRequired" :disabled="$store.themeSettings.hasDirtyChanges() || $store.themeSettings.saving" @click="$store.themeSettings.reloadPage()">刷新页面</button>
              <button type="button" class="theme-settings-primary-button" :disabled="!$store.themeSettings.hasDirtyChanges() || $store.themeSettings.saving || $store.themeSettings.hasValidationErrors() || $store.themeAssets.visible" @click="$store.themeSettings.save()"><span class="theme-settings-button-spinner" x-show="$store.themeSettings.saving" aria-hidden="true"></span><span x-text="$store.themeSettings.saving ? '应用中…' : '应用'"></span></button>
            </div>
          </footer>
        </div>
      </div>
    </section>
    <th:block th:replace="~{modules/shell/theme-asset-picker :: picker}" />
  </div>
</th:block>
