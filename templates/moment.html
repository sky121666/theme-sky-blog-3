<!DOCTYPE html>
<th:block xmlns:th="https://www.thymeleaf.org"
          xmlns:halo="https://halo.run/schema/thymeleaf"
          th:with="
            rawMomentText=${moment.spec.content != null ? (!#strings.isEmpty(moment.spec.content.raw) ? moment.spec.content.raw : (moment.spec.content.html != null ? moment.spec.content.html : '')) : ''},
            cleanMomentText=${!#strings.isEmpty(rawMomentText) ? rawMomentText.replaceAll('(?s)```.*$', ' ').replaceAll('&lt;[^&gt;]+&gt;', ' ').replaceAll('&amp;nbsp;', ' ').replaceAll('\s+', ' ').trim() : ''},
            resolvedMomentLabel=${!#strings.isEmpty(cleanMomentText) ? #strings.abbreviate(cleanMomentText, 42) : ((moment.spec.content != null and moment.spec.content.medium != null and !#lists.isEmpty(moment.spec.content.medium)) ? '图片瞬间' : '瞬间记录')},
            resolvedMomentDescription=${!#strings.isEmpty(cleanMomentText) ? #strings.abbreviate(cleanMomentText, 140) : (site.seo?.description ?: site.subtitle)}">
  <html th:replace="~{modules/shell/layout :: html(
          title = ${resolvedMomentLabel + ' - ' + site.title},
          description = ${resolvedMomentDescription},
          ssrContent = ~{modules/moments-app/detail :: content},
          canonical = ${'/moments/' + moment.metadata.name},
          image = ${(moment.spec.content != null and moment.spec.content.medium != null and !#lists.isEmpty(moment.spec.content.medium) and moment.spec.content.medium[0].type.name() == 'PHOTO') ? moment.spec.content.medium[0].url : site.logo},
          type = 'article',
          seoFallback = 'full',
          robots = '',
          serverDescription = true,
          serverSocialIdentity = true,
          pageMode = 'browser-moments',
          pageApp = 'moments',
          windowVariant = 'moments',
          windowTitle = '详情',
          windowScene = 'detail',
          windowResizable = 'y',
          windowMaximizable = false,
          windowMetricsKey = 'moments'
        )}"></html>
</th:block>
