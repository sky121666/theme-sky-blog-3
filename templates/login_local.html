<!-- ========================================== -->
<!--    Login Local - 本地登录表单              -->
<!--    包含账号密码输入及忘记密码链接功能       -->
<!-- ========================================== -->

<div th:remove="tag" th:fragment="form">
    <!-- 公钥登录只提交隐藏密文字段；可见密码保留自动填充语义，锁屏切步只增强视觉与交互。 -->
    <div class="auth-lockscreen-native-fields" data-auth-lockscreen-native>
        <div class="auth-lockscreen-step auth-lockscreen-step-identity" data-auth-lockscreen-step="identity">
            <div class="auth-field auth-field-compact auth-lockscreen-field">
                <label for="username">用户名 / 邮箱</label>
                <input id="username" name="username" type="text" placeholder="用户名或邮箱" autocomplete="username"
                    spellcheck="false" autocorrect="off" autocapitalize="off" required
                    class="auth-input auth-lockscreen-input" />
                <button type="button" class="auth-lockscreen-submit" data-auth-lockscreen-advance
                    aria-label="继续输入密码" title="继续">
                    <span class="icon-[lucide--arrow-right]" aria-hidden="true"></span>
                </button>
            </div>
        </div>

        <div class="auth-lockscreen-step auth-lockscreen-step-password" data-auth-lockscreen-step="password"
            aria-hidden="true">
            <div class="auth-lockscreen-account-row">
                <button type="button" class="auth-lockscreen-account-back" data-auth-lockscreen-back
                    aria-label="返回修改用户名" title="修改用户名">
                    <span class="icon-[lucide--chevron-left]" aria-hidden="true"></span>
                </button>
                <span data-auth-lockscreen-account-label>账户</span>
            </div>
            <div class="auth-field auth-field-compact auth-lockscreen-field auth-password-wrap">
                <label for="password">密码</label>
                <input id="password" th:name="${#strings.isEmpty(publicKey) ? 'password' : null}"
                    type="password" placeholder="输入密码" autocomplete="current-password"
                    aria-describedby="auth-encryption-error" required maxlength="257"
                    class="auth-input auth-lockscreen-input" />
                <input th:if="${not #strings.isEmpty(publicKey)}" id="encrypted-password"
                    type="hidden" name="password" value="" autocomplete="off" />
                <button type="button" class="auth-toggle-password auth-lockscreen-password-toggle"
                    aria-label="显示密码" aria-controls="password" aria-pressed="false">
                    <span class="auth-icon-eye-show icon-[lucide--eye]" aria-hidden="true"></span>
                    <span class="auth-icon-eye-hide icon-[lucide--eye-off]" style="display:none" aria-hidden="true"></span>
                </button>
                <button type="submit" class="auth-lockscreen-submit" data-auth-lockscreen-submit
                    aria-label="登录" title="登录">
                    <span class="icon-[lucide--arrow-right]" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>

    <p id="auth-encryption-error" class="auth-alert auth-alert-error auth-encryption-error"
        data-auth-encryption-error role="alert" hidden></p>
    <p class="auth-visually-hidden" data-auth-lockscreen-status aria-live="polite"></p>
</div>
