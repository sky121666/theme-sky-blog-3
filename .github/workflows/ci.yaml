name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_READER_PATH: ${{ vars.SMOKE_READER_PATH }}
      SMOKE_AUTHOR_PATH: ${{ vars.SMOKE_AUTHOR_PATH }}
      SMOKE_MOMENT_DETAIL_PATH: ${{ vars.SMOKE_MOMENT_DETAIL_PATH }}
      SMOKE_REQUIRE_PLUGIN_ROUTES: ${{ vars.SMOKE_REQUIRE_PLUGIN_ROUTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm run check

      - name: Live smoke scope
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "Live smoke skipped: SMOKE_BASE_URL is unset; this job covered static and offline checks only."
          elif [[ "$SMOKE_REQUIRE_PLUGIN_ROUTES" =~ ^(1|[Tt][Rr][Uu][Ee])$ ]]; then
            echo "Live smoke enabled with required plugin routes."
          else
            echo "Live smoke enabled; unavailable plugin routes may be skipped."
          fi

      - name: Playwright Smoke
        if: env.SMOKE_BASE_URL != ''
        run: pnpm run smoke:playwright
